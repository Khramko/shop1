openapi: 3.0.3
info:
  title: Shop API
  version: 1.0.0
  description: Публичный HTTP API Shop Stream App (Event Collaboration + Saga + Idempotency-Key).
servers:
  - url: http://arch.homework
paths:
  /auth/register:
    post:
      summary: Регистрация
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:     { type: string }
                email:    { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:    { type: integer, format: int64 }
                  token: { type: string }
        '409': { description: Conflict }
  /auth/login:
    post:
      summary: Логин
      tags: [User]
      responses: { '200': { description: OK } }
  /billing/accounts/me:
    get:
      summary: Текущий аккаунт
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
  /billing/accounts/me/deposit:
    post:
      summary: Пополнить
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 0.01 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
  /orders:
    post:
      summary: Создать заказ (async, saga)
      tags: [Order]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 64 }
          description: |
            Если передан — вызов идемпотентен: повторный запрос с тем же ключом
            вернёт сохранённый ответ с заголовком X-Idempotent-Replay: true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price:        { type: number, minimum: 0.01 }
                sku:          { type: string, description: "Обязателен при saga.enabled=true" }
                qty:          { type: integer, minimum: 1, description: "Обязателен при saga.enabled=true" }
                deliverySlot: { type: string, description: "Обязателен при saga.enabled=true" }
      responses:
        '202':
          description: Accepted
          headers:
            X-Idempotent-Replay:
              schema: { type: string, enum: ["true"] }
              description: Присутствует только при replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Validation error }
        '409':
          description: Idempotency-Key уже используется другим запросом
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [ idempotency_in_progress ] }
                  details: { type: string }
    get:
      summary: Список заказов текущего пользователя
      tags: [Order]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
  /orders/{id}:
    get:
      summary: Получить заказ
      tags: [Order]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { description: Forbidden — чужой заказ }
  /notifications:
    get:
      summary: Уведомления текущего пользователя
      tags: [Notification]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Account:
      type: object
      properties:
        accountId: { type: integer, format: int64 }
        userId:    { type: integer, format: int64 }
        balance:   { type: number }
    Order:
      type: object
      properties:
        orderId:      { type: integer, format: int64 }
        userId:       { type: integer, format: int64 }
        price:        { type: number }
        sku:          { type: string, nullable: true }
        qty:          { type: integer, nullable: true }
        deliverySlot: { type: string, nullable: true }
        status:
          type: string
          enum: [NEW, RESERVING, PAID, COMPENSATING, FAILED, COMPENSATION_FAILED]
        createdAt:    { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id:        { type: integer, format: int64 }
        userId:    { type: integer, format: int64 }
        orderId:   { type: integer, format: int64 }
        type:      { type: string, enum: [HAPPY, ANGRY] }
        subject:   { type: string }
        body:      { type: string }
        createdAt: { type: string, format: date-time }