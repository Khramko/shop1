apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: shop }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [ { name: pg, port: 5432, targetPort: 5432 } ]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: shop }
spec:
  selector: { app: postgres }
  ports: [ { name: pg, port: 5432, targetPort: 5432 } ]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: shop }
spec:
  accessModes: [ ReadWriteOnce ]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: shop }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [ { containerPort: 5432 } ]
          env:
            - { name: POSTGRES_USER,     value: app_user }
            - { name: POSTGRES_PASSWORD, value: securePassword123 }
            - { name: POSTGRES_DB,       value: postgres }
          volumeMounts: [ { name: data, mountPath: /var/lib/postgresql/data } ]
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -h 127.0.0.1 -U app_user -d postgres"
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "512Mi", cpu: "500m" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: batch/v1
kind: Job
metadata: { name: postgres-init-dbs, namespace: shop }
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16-alpine
          env: [ { name: PGPASSWORD, value: securePassword123 } ]
          command: ["sh","-c"]
          args:
            - |
              until pg_isready -h postgres -U app_user; do sleep 1; done
              for db in user_db billing_db order_db notification_db warehouse_db delivery_db; do
                echo "CREATE DATABASE $db OWNER app_user;" | \
                  psql -h postgres -U app_user -d postgres -v ON_ERROR_STOP=1 || true
              done
