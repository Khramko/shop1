apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: shop }
spec:
  clusterIP: None
  selector: { app: kafka }
  ports:
    - { name: broker,     port: 9092, targetPort: 9092 }
    - { name: controller, port: 9093, targetPort: 9093 }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: shop }
spec:
  selector: { app: kafka }
  ports: [ { name: broker, port: 9092, targetPort: 9092 } ]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: kafka-data, namespace: shop }
spec:
  accessModes: [ ReadWriteOnce ]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: shop }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          ports: [ { containerPort: 9092 }, { containerPort: 9093 } ]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka.shop.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka.shop.svc.cluster.local:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: CLUSTER_ID, value: "4L6G9nxwQreSVeTuSsh_Hg" }  # ← добавлено
          volumeMounts: [ { name: data, mountPath: /var/lib/kafka/data } ]
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"
            initialDelaySeconds: 45   # было 15, Kafka KRaft стартует дольше
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 10
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits:   { memory: "1Gi",   cpu: "1000m" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: kafka-data }