databaseChangeLog:
  - changeSet:
      id: 001-create-accounts
      author: shop
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column: { name: id,       type: BIGSERIAL, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id,  type: BIGINT,    constraints: { nullable: false, unique: true } }
              - column: { name: balance,  type: "NUMERIC(19,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
