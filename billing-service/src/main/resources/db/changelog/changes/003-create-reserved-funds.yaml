databaseChangeLog:
  - changeSet:
      id: 003-create-reserved-funds
      author: shop
      changes:
        - createTable:
            tableName: reserved_funds
            columns:
              - column: { name: order_id,   type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id,    type: BIGINT, constraints: { nullable: false } }
              - column: { name: amount,     type: "NUMERIC(19,2)", constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
