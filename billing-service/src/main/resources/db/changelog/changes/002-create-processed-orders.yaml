databaseChangeLog:
  - changeSet:
      id: 002-create-processed-orders
      author: shop
      changes:
        - createTable:
            tableName: processed_orders
            columns:
              - column: { name: order_id,     type: BIGINT,    constraints: { primaryKey: true, nullable: false } }
              - column: { name: processed_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
