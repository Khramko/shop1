server:
  port: 8081
spring:
  application.name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:securePassword123}
  jpa:
    hibernate.ddl-auto: validate
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties.spring.json.add.type.headers: false
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.shop.common.events"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.Map
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: always
  metrics:
    tags.application: ${spring.application.name}
    distribution.percentiles-histogram.http.server.requests: true
    distribution.percentiles.http.server.requests: 0.5,0.95,0.99
security.jwt:
  secret-key: ${JWT_SECRET_KEY:change-me-please-this-key-must-be-at-least-32-chars}
  expiration-ms: 3600000
