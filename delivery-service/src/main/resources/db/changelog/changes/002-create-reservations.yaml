databaseChangeLog:
  - changeSet:
      id: 002-create-reservations-delivery
      author: shop
      changes:
        - createTable:
            tableName: reservations
            columns:
              - column: { name: order_id,   type: BIGINT,     constraints: { primaryKey: true, nullable: false } }
              - column: { name: courier_id, type: BIGINT,     constraints: { nullable: false } }
              - column: { name: slot,       type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: status,     type: VARCHAR(16), defaultValue: RESERVED, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP,   defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
