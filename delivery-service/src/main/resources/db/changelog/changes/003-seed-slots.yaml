databaseChangeLog:
  - changeSet:
      id: 003-seed-slots
      author: shop
      changes:
        - sql:
            sql: |
              DO $$
              DECLARE d INT; h INT; c INT;
              BEGIN
                FOR d IN 0..29 LOOP
                  FOR h IN 0..3 LOOP
                    FOR c IN 1..3 LOOP
                      INSERT INTO courier_slots(courier_id, slot, status)
                      VALUES (c,
                              to_char(current_date + d, 'YYYY-MM-DD') || 'T' || lpad((10 + h*2)::text, 2, '0') || ':00',
                              'FREE');
                    END LOOP;
                  END LOOP;
                END LOOP;
              END $$;
