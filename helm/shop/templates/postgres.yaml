apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: {{ .Values.namespace }} }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [ { name: pg, port: 5432, targetPort: 5432 } ]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: {{ .Values.namespace }} }
spec:
  selector: { app: postgres }
  ports: [ { name: pg, port: 5432, targetPort: 5432 } ]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: {{ .Values.namespace }} }
spec:
  accessModes: [ ReadWriteOnce ]
  resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: {{ .Values.namespace }} }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [ { containerPort: 5432 } ]
          env:
            - { name: POSTGRES_USER,     value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }} }
            - { name: POSTGRES_DB,       value: postgres }
          volumeMounts: [ { name: data, mountPath: /var/lib/postgresql/data } ]
          readinessProbe:
            exec: { command: [ "pg_isready", "-U", {{ .Values.postgres.user | quote }} ] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: batch/v1
kind: Job
metadata: { name: postgres-init-dbs, namespace: {{ .Values.namespace }} }
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16-alpine
          env: [ { name: PGPASSWORD, value: {{ .Values.postgres.password | quote }} } ]
          command: ["sh","-c"]
          args:
            - |
              until pg_isready -h postgres -U {{ .Values.postgres.user }}; do sleep 1; done
              for db in user_db billing_db order_db notification_db warehouse_db delivery_db; do
                echo "CREATE DATABASE $db OWNER {{ .Values.postgres.user }};" | \
                  psql -h postgres -U {{ .Values.postgres.user }} -d postgres -v ON_ERROR_STOP=1 || true
              done
