apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-common
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: {{ .Values.postgres.user | quote }}
  KAFKA_BOOTSTRAP: "kafka:9092"
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
  JWT_SECRET_KEY: {{ .Values.jwt.secretKey | quote }}
