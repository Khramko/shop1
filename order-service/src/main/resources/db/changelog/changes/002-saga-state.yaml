databaseChangeLog:
  - changeSet:
      id: 002-saga-state
      author: shop
      changes:
        - createTable:
            tableName: saga_states
            columns:
              - column: { name: order_id,       type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: step,           type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: failure_reason, type: VARCHAR(255) }
              - column: { name: updated_at,     type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
  - changeSet:
      id: 003-orders-add-sku-qty-slot
      author: shop
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column: { name: sku,           type: VARCHAR(64) }
              - column: { name: qty,           type: INT }
              - column: { name: delivery_slot, type: VARCHAR(32) }
