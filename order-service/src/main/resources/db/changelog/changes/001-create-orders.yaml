databaseChangeLog:
  - changeSet:
      id: 001-create-orders
      author: shop
      changes:
        - createTable:
            tableName: orders
            columns:
              - column: { name: id,         type: BIGSERIAL,      constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id,    type: BIGINT,         constraints: { nullable: false } }
              - column: { name: price,      type: "NUMERIC(19,2)", constraints: { nullable: false } }
              - column: { name: status,     type: VARCHAR(16),    defaultValue: NEW, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP,      defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: orders
            indexName: idx_orders_user_id
            columns: [ { column: { name: user_id } } ]
