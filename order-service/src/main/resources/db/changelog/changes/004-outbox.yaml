databaseChangeLog:
  - changeSet:
      id: 004-create-outbox
      author: shop
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column: { name: id,             type: BIGSERIAL,   constraints: { primaryKey: true, nullable: false } }
              - column: { name: aggregate_type, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: aggregate_id,   type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: event_type,     type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: topic,          type: VARCHAR(128),constraints: { nullable: false } }
              - column: { name: payload,        type: TEXT,        constraints: { nullable: false } }
              - column: { name: status,         type: VARCHAR(16), defaultValue: PENDING, constraints: { nullable: false } }
              - column: { name: retry_count,    type: INT,         defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at,     type: TIMESTAMP,   defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: published_at,   type: TIMESTAMP }
        - createIndex:
            tableName: outbox
            indexName: idx_outbox_status_id
            columns: [ { column: { name: status } }, { column: { name: id } } ]
        - sql:
            sql: "ALTER TABLE outbox ADD CONSTRAINT chk_outbox_status CHECK (status IN ('PENDING','FAILED','PUBLISHED','DEAD_LETTER'))"
