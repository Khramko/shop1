databaseChangeLog:
  - changeSet:
      id: 002-create-user-email-projection
      author: shop
      changes:
        - createTable:
            tableName: user_email_projection
            columns:
              - column: { name: user_id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: email,   type: VARCHAR(255), constraints: { nullable: false } }
