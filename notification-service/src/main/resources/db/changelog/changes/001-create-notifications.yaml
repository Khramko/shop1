databaseChangeLog:
  - changeSet:
      id: 001-create-notifications
      author: shop
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column: { name: id,         type: BIGSERIAL, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id,    type: BIGINT,    constraints: { nullable: false } }
              - column: { name: order_id,   type: BIGINT }
              - column: { name: type,       type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: subject,    type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: body,       type: VARCHAR(2000), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_user_id
            columns: [ { column: { name: user_id } } ]
